<body class="bg-surface text-on-surface font-body-md selection:bg-primary-container selection:text-on-primary-container min-h-screen flex flex-col">
<!-- TopAppBar Shell - Passive State for Transactional Screen -->
<header class="bg-white/80 backdrop-blur-md border-b border-zinc-200/50 shadow-sm fixed w-full top-0 z-50">
<div class="max-w-7xl mx-auto px-8 flex justify-between items-center h-20">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-3xl">landscape</span>
<span class="text-2xl font-bold tracking-tight text-zinc-800">Natours</span>
</div>
<nav class="hidden md:flex items-center gap-8">
<a class="font-serif text-base font-medium text-zinc-600 hover:text-primary transition-colors" href="#">All Tours</a>
<a class="font-serif text-base font-medium text-zinc-600 hover:text-primary transition-colors" href="#">Reviews</a>
<a class="font-serif text-base font-medium text-zinc-600 hover:text-primary transition-colors" href="#">Contact</a>
</nav>
<div class="flex items-center gap-4">
<a class="px-6 py-2.5 rounded-full font-label-lg text-primary hover:bg-primary-fixed/20 transition-all" href="#">Sign Up</a>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center pt-20 px-4 relative overflow-hidden bg-surface-bright">
<!-- Aesthetic Background Elements -->
<div class="absolute top-0 left-0 w-full h-full opacity-5 pointer-events-none">
<div class="absolute top-[-10%] right-[-10%] w-[500px] h-[500px] bg-primary rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[500px] h-[500px] bg-secondary rounded-full blur-[120px]"></div>
</div>
<!-- Login Card Section -->
<section class="w-full max-w-md relative z-10 py-section-padding">
<div class="bg-surface-container-lowest rounded-xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-outline-variant/30 overflow-hidden">
<!-- Card Header -->
<div class="p-8 pb-0 text-center">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">Welcome Back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Access your premium adventure dashboard</p>
</div>
<!-- Form Content -->
<div class="p-8">
<form action="#" class="space-y-6" method="POST">
<!-- Email Field -->
<div class="space-y-2">
<label class="font-label-lg text-label-lg text-on-surface-variant block uppercase tracking-wider" for="email">
                                Email Address
                            </label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full pl-12 pr-4 py-3.5 bg-surface-container-low border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all font-body-md text-on-surface placeholder:text-outline/60" id="email" name="email" placeholder="explorer@natours.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="font-label-lg text-label-lg text-on-surface-variant block uppercase tracking-wider" for="password">
                                    Password
                                </label>
<a class="text-label-sm font-label-sm text-primary hover:underline" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full pl-12 pr-4 py-3.5 bg-surface-container-low border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all font-body-md text-on-surface placeholder:text-outline/60" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-xl">visibility</span>
</button>
</div>
</div>
<!-- Login Action -->
<div class="pt-2">
<button class="w-full bg-primary-container text-on-primary-container font-label-lg text-body-lg py-4 rounded-lg shadow-md hover:shadow-lg hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
                                Log In
                                <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</form>
<!-- Divider -->
<div class="my-8 flex items-center gap-4">
<div class="h-[1px] flex-grow bg-outline-variant"></div>
<span class="text-label-sm font-label-sm text-outline uppercase tracking-widest">or</span>
<div class="h-[1px] flex-grow bg-outline-variant"></div>
</div>
<!-- Alternate Logins -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 py-3 px-4 border border-outline-variant rounded-lg hover:bg-surface-container-high transition-colors font-label-lg text-on-surface">

                            Google
                        </button>

<span class="material-symbols-outlined text-on-surface" style="font-variation-settings: 'FILL' 1;">ios</span>
                            Apple
                        </button>

<p class="font-body-md text-on-surface-variant">
                        Don't have an account? 
                        <a class="text-primary font-semibold hover:underline" href="#">Join the adventure</a>
</p>
</div>
</div>
</section>
<!-- Decorative Card Image -->
<div class="hidden lg:block absolute bottom-12 right-12 w-64 h-64 rotate-6 opacity-40">
<div class="relative w-full h-full rounded-xl overflow-hidden shadow-2xl grayscale hover:grayscale-0 transition-all duration-700">
<img class="w-full h-full object-cover" data-alt="A breathtaking wide-angle shot of a sharp, snow-capped mountain peak piercing through a layer of soft white clouds under a clear blue sky. The lighting is crisp and natural, highlighting the rugged textures of the rock and the pristine quality of the snow. This high-resolution nature photograph captures a sense of elite outdoor exploration and quiet mountain serenity, perfectly aligning with the premium Natours brand aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDc2w59bwsu7XIzP2CWp1ooTbfCKkAtOEgG9jDdna-5APQJc5kASLugknb6iTnp1236vgxcW4bseKiX4aMmboXctEO3AIUNlw0x-rQYniA1S-pmvZwZ9UOSJl8nsiJHcyJfVLzP5tjbHU61n4QYhDmhxf3bOAUmlIKtidVHvlsMCIJ_7Gl1nRcjDITzJiXzbtsOs-IfgplPPLvIKaan5h3IIWnc3p65XjnNPiYAogQB9dLdo605XknEKSP8F2EfvGE42bK_cOLjXzA"/>
</div>
</div>

<div class="max-w-7xl mx-auto px-8 flex flex-col md:flex-row justify-between items-center gap-8">
<p class="font-sans text-sm text-zinc-500">© 2024 Natours Adventure. All rights reserved.</p>
<div class="flex gap-6">
<a class="text-zinc-500 hover:text-primary transition-colors text-sm hover:underline decoration-primary/30" href="#">About Us</a>
<a class="text-zinc-500 hover:text-primary transition-colors text-sm hover:underline decoration-primary/30" href="#">Careers</a>
<a class="text-zinc-500 hover:text-primary transition-colors text-sm hover:underline decoration-primary/30" href="#">Privacy Policy</a>

</div>
