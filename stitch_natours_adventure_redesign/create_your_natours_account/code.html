<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>

<body class="bg-background font-body-md text-on-background selection:bg-primary-container selection:text-on-primary-container">
<!-- Hero Background with Sign Up Card -->
<main class="relative min-h-screen flex items-center justify-center overflow-hidden py-section-padding">
<!-- Background Imagery -->
<div class="absolute inset-0 z-0">
<img alt="" class="w-full h-full object-cover" data-alt="A panoramic wide-angle photograph of majestic snow-capped mountain peaks piercing through a sea of clouds during the golden hour. The sunlight casts a warm, orange glow on the rugged alpine terrain, contrasting with the deep forest greens of the valley below. The scene evokes a sense of vastness and adventure, captured in a high-key, technical luxury aesthetic consistent with a premium wilderness concierge service." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDJxMMpIh5siSeKjemenYZXhqOqJuFFS8ctsDYOXqnAz1JTiL_nRsuch-AoDuEPoHu5kYoywNwBYRE6u-tOzqWknN96hpvkMxSwXo6vwBOwsolPvcaR-bvze5rWuHF-MGWqQNOdVNsZ-R-KKgt6vBfZH2Tfhu2AnHnNIwpbDfqVnqN6l9S4vGnmzMNBa-RocSdIZhzyr0sua5iwxl8VmuEwPU-BQZMeNQrR4ZHwYJbJEhVXvkSHyHXL52BOnKIHpPHOQZ0l8si_584"/>
<div class="absolute inset-0 bg-zinc-900/20 mix-blend-multiply"></div>
</div>
<!-- Content Container -->
<div class="relative z-10 w-full max-w-xl px-margin">
<!-- Logo Section -->
<div class="text-center mb-base-12 mb-8">
<span class="font-headline-xl text-white tracking-tight drop-shadow-md">Natours</span>
</div>
<!-- Central Form Card -->
<div class="glass-panel rounded-xl shadow-2xl p-8 md:p-12 border border-white/20">
<div class="mb-8">
<h1 class="font-headline-md text-on-background mb-2">Join the Adventure</h1>
<p class="font-body-md text-on-surface-variant">Create your account to start exploring the world's most breathtaking destinations.</p>
</div>
<form class="space-y-6">
<!-- Full Name Field -->
<div class="space-y-2">
<label class="font-label-lg text-on-surface-variant block uppercase" for="full_name">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="person">person</span>
<input class="w-full pl-10 pr-4 py-3 bg-white/50 border border-outline/30 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-200 font-body-md placeholder:text-outline/50" id="full_name" placeholder="John Doe" type="text"/>
</div>
</div>
<!-- Email Field -->
<div class="space-y-2">
<label class="font-label-lg text-on-surface-variant block uppercase" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="mail">mail</span>
<input class="w-full pl-10 pr-4 py-3 bg-white/50 border border-outline/30 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-200 font-body-md placeholder:text-outline/50" id="email" placeholder="john@example.com" type="email"/>
</div>
</div>
<!-- Password Fields Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
<div class="space-y-2">
<label class="font-label-lg text-on-surface-variant block uppercase" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="lock">lock</span>
<input class="w-full pl-10 pr-4 py-3 bg-white/50 border border-outline/30 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-200 font-body-md placeholder:text-outline/50" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="space-y-2">
<label class="font-label-lg text-on-surface-variant block uppercase" for="confirm_password">Confirm Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="shield">shield</span>
<input class="w-full pl-10 pr-4 py-3 bg-white/50 border border-outline/30 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-200 font-body-md placeholder:text-outline/50" id="confirm_password" placeholder="••••••••" type="password"/>
</div>
</div>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start gap-3 pt-2">
<input class="mt-1 h-4 w-4 rounded border-outline/30 text-primary focus:ring-primary" id="terms" type="checkbox"/>
<label class="font-label-sm text-on-surface-variant" for="terms">
                            I agree to the <a class="text-primary hover:underline" href="#">Terms of Service</a> and <a class="text-primary hover:underline" href="#">Privacy Policy</a>.
                        </label>
</div>
<!-- Primary Action Button -->
<button class="w-full py-4 bg-secondary-container text-on-secondary font-label-lg rounded-full shadow-lg hover:bg-secondary transition-all duration-300 transform hover:-translate-y-1 active:scale-95 uppercase tracking-widest mt-4" type="submit">
                        Sign Up
                    </button>
</form>
<!-- Redirect Link -->
<div class="mt-10 pt-8 border-t border-outline/10 text-center">
<p class="font-body-md text-on-surface-variant">
                        Already have an account? 
                        <a class="font-label-lg text-primary hover:text-on-primary-fixed-variant transition-colors ml-1 uppercase underline decoration-primary/30 underline-offset-4" href="#">Log In</a>
</p>
</div>
</div>
<!-- Footer Branding (Simplified for Auth) -->
<div class="mt-12 text-center">
<p class="font-label-sm text-white/70 tracking-widest uppercase">© 2024 Natours Adventure. All rights reserved.</p>
</div>
</div>
</main>
<!-- Floating Action Button (Suppressed per task logic for transactional screens) -->
</body></html>
